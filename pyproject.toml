[project]
name = "semi-final-work"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.1",
    "langchain-pinecone>=0.2.13",
    "numpy>=2.3.5",
    "paddleocr>=3.4.1",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "pinecone>=7.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
