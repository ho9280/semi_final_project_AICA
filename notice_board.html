<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | 광주인공지능사관학교</title>
<style>
  :root{
    --bg:#F4F6FB;
    --surface:#FFFFFF;
    --border:#E3E7F0;
    --text:#1B1E29;
    --text-muted:#6B7280;
    --text-faint:#9CA3AF;
    --accent:#2F5FE0;
    --accent-ink:#1D3FA6;
    --accent-soft:#EAF0FE;
    --new-bg:#FFF1E9;
    --new-text:#D9611E;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* Header */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .back-btn{
    display:flex;
    align-items:center;
    gap:4px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:6px 4px;
    border-radius:8px;
  }
  .back-btn:hover{ background:var(--accent-soft); color:var(--accent-ink); }

  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:14px 0 20px;
  }
  .title-row h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .title-row .count{
    font-size:14px;
    color:var(--text-muted);
    font-weight:600;
  }

  /* Search */
  .search-wrap{
    position:relative;
    margin-bottom:18px;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    stroke:var(--text-faint);
  }
  .search-wrap input{
    width:100%;
    padding:13px 14px 13px 40px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-size:15px;
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .search-hint{
    margin:8px 2px 0;
    font-size:12.5px;
    color:var(--text-faint);
  }

  /* List */
  .list{
    margin-top:18px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--surface);
  }
  .row{
    border-bottom:1px solid var(--border);
  }
  .row:last-child{ border-bottom:none; }

  .row-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    cursor:pointer;
    user-select:none;
  }
  .row-head:hover{ background:#FAFBFF; }

  .no-badge{
    flex:0 0 auto;
    min-width:34px;
    text-align:center;
    font-size:12.5px;
    font-weight:700;
    color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }
  .row-main{
    flex:1 1 auto;
    min-width:0;
  }
  .row-title-line{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .row-title{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .new-badge{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:800;
    color:var(--new-text);
    background:var(--new-bg);
    padding:2px 6px;
    border-radius:6px;
    letter-spacing:0.02em;
  }
  .clip-badge{
    flex:0 0 auto;
    font-size:13px;
    color:var(--text-faint);
  }
  .row-date{
    margin-top:3px;
    font-size:12.5px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .chevron{
    flex:0 0 auto;
    color:var(--text-faint);
    transition:transform .18s ease;
  }
  .row.open .chevron{ transform:rotate(180deg); color:var(--accent); }

  .row-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
    background:#FBFCFE;
  }
  .row.open .row-body{ max-height:2000px; }
  .row-body-inner{
    padding:2px 18px 20px 62px;
  }
  .notice-content{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:14px;
    line-height:1.65;
    color:#3A3F4B;
    margin:0 0 14px;
  }
  .attachments{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .attachment-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    width:fit-content;
    padding:9px 13px;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent-ink);
    text-decoration:none;
    font-size:13.5px;
    font-weight:700;
  }
  .attachment-link:hover{ background:#DDE7FE; }
  .attachment-link .ext{
    font-size:10.5px;
    font-weight:800;
    background:var(--accent);
    color:#fff;
    padding:1px 5px;
    border-radius:4px;
    text-transform:uppercase;
  }

  /* Empty / loading */
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
  }
  .empty-state .icon{ font-size:30px; margin-bottom:10px; }

  .sentinel{
    height:1px;
  }
  .load-tail{
    text-align:center;
    padding:16px 0 4px;
    font-size:12.5px;
    color:var(--text-faint);
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <button class="back-btn" onclick="history.back()" aria-label="메인으로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <div class="title-row">

    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="제목으로 검색" autocomplete="off">

    <div class="list" id="listEl"></div>
    <div class="load-tail" id="loadTail"></div>
    <div class="sentinel" id="sentinel"></div>
  </div>

소통의 장!\n매월 한 번, 인공지능사관학교 전체 교육생과 운영진이 함께하는 Talk Up 행사에 여러분을 초대합니다!\nTalk Up에서는\n✔ 따뜻한 칭찬이 오가는 [인사교 킹오브킹]\n✔ 서로의 경험을 나누는 [인사교 쇼케이스]\n✔ 함께 성장하는 이야기를 듣는 [공감 우체통]\n✔ 사관학교와 소통하는 [인사교 더 나은 내일/무엇이든 물어보살]\n🗓 일시: 2026년 7월 14일(화) 16:00~16:30\n📍 참여 링크: https://meet.google.com/sng-dwuw-caf\n🎤 대상: 인공지능사관학교 전 교육생\n🎁 칭찬합시다와 인사교 쇼케이스를 진행한 교육생에게는 소정의 선물 제공\n[참여 설문 안내]\n📪 인사교 킹오브킹\n평소 칭찬하고 싶은 교육생, 운영진, 강사님, 멘토님(보조강사)가 있다면 아래 링크를 통해서 추천해주세요!\n칭찬설문 링크: https://forms.gle/JNExdHDGRWeAhob37\n📮 공감 우체통\n평소 사관학교에 대해 궁금했던 점 혹은 소통하고 싶은 내용들을 작성해주세요!\n소통함 링크: https://forms.gle/fBTYgDYiW2LZDPmR7\n📮 무엇이든 물어보살\n무엇이든 물어보살 : https://forms.gle/fjVNo3Y6WSW7oEtQ9\n성장하는 여러분의 목소리를 들려주고\n함께 나누고, 함께 웃는 \"Talk Up\", 절대 놓치지 마세요!\n감사합니다.", "attachments": []}, {"notice_id": 32, "title": "[AI 도약과정] 핸드북 및 안내자료", "release_date": "2026-07-08", "content": "AI 도약과정 프로젝트를 시작하기에 앞서 AI 도약과정 핸드북과 프로젝트 유형 안내자료를 공유드립니다.\n도약과정에서는 기업 프로젝트, 실증 프로젝트, 창업 프로젝트 중 본인의 진로와 목표에 맞는 프로젝트 유형을 선택하게 됩니다.\n프로젝트 유형별로 커리어 방향과 주요 수행 내용이 서로 다르므로, 첨부된 핸드북과 안내자료를 반드시 꼼꼼히 확인하시어 본인에게 가장 적합한 프로젝트 유형이 무엇인지 충분히 고민해 보시기 바랍니다.\n이번에 공유드리는 자료는 프로젝트 유형 선택뿐만 아니라, 도약과정의 전체 운영 방식과 팀 편성, 매칭데이, 멘토링 등 프로젝트 진행에 필요한 주요 내용을 담고 있는 안내자료이므로, 반드시 한 번 이상 정독해 주시기 바랍니다!\n감사합니다.", "attachments": [{"file_name": "7기_AI 도약과정_핸드북.pdf.pdf", "file_type": "pdf", "url": "./AICA_notice/notice_attachment/32/7기_AI 도약과정_핸드북.pdf.pdf"}, {"file_name": "7기_AI_도약과정_안내.pdf.pdf", "file_type": "pdf", "url": "./AICA_notice/notice_attachment/32/7기_AI_도약과정_안내.pdf.pdf"}]}, {"notice_id": 30, "title": "이스트 인공지능 전문가 자격증(ESTAIC) 안내 및 응시 희망자 수요조사", "release_date": "2026-07-03", "content": "안녕하세요.\n인공지능사관학교 운영팀입니다.\n🎉 이스트소프트 AI 역량 검증 자격증, ESTAIC를 소개합니다!\n현재 나의 AI 기초 역량을 객관적으로 점검하고 실무 역량까지 함께 검증해보고 싶다면 ESTAIC 자격증에 도전해보세요!\nESTAIC는 초급(Basic) → 중급(Professional) → 고급(Expert) 3단계로 구성된 AI 민간 자격증으로, AI 개발 및 활용 역량을 체계적으로 검증할 수 있습니다.\n이번에는 초급(Basic) 시험 응시 희망자를 대상으로 수요 조사를 진행하고자 합니다.\n응시를 희망하는 교육생은 아래 설문을 작성해주시기 바랍니다.\n📅 예상 시험 일정 : 7월 말\n📌 설문링크 : https://forms.gle/QiHTk9u3ZNAQHnXh7\n※ 시험 응시를 희망하는 경우 구름EDU ID를 함께 작성해 주셔야 시험 응시 권한이 부여됩니다.\n※ 세부 일정은 수요 조사 결과를 바탕으로 추후 안내 드리겠습니다.\nAI 역량을 객관적으로 확인하고 가장 먼저 도전할 수 있는 기회인 만큼 많은 관심과 참여 부탁 드립니다.\n💪 ESTAIC 와 함께 AI 역량을 한 단계 성장시켜 보세요!", "attachments": [{"file_name": "ESTAIC_자격증_포스터.png.png", "file_type": "png", "url": "./AICA_notice/notice_attachment/30/ESTAIC_자격증_포스터.png.png"}]}, {"notice_id": 29, "title": "[도약과정 안내 설명회 진행 안내]", "release_date": "2026-06-30", "content": "안녕하세요!\n인공지능사관학교입니다.\n5월부터 진행되었던 AI준비과정동안 여러분들이 학습해온 AI 이론과 기술을 실제 프로젝트로 연결하는 도약과정에 대해 여러분들의 궁금증을 해소시킬 시간을 드디어 마련했습니다.\nAI도약과정은 지금까지 배운 내용을 바탕으로 직접 프로젝트를 기획하고 구현하며, 실무 역량을 키워나가는 중요한 과정입니다.\n해당 설명회를 통해 프로젝트 진행 방식 등 AI도약과정 전반에 대한 내용을 설명드릴 예정이니 모두 참여해 주시기 바랍니다\n📌 일시\n2026년 7월 1일(수) 17:30 ~ 18:00, 당일 링크 전달 예정\n📌 내용\n· 도약과정 소개\n· 프로젝트 진행 방향 및 운영 방식 안내\n· 주요 일정 안내\n· 질의응답\n감사합니다.", "attachments": []}, {"notice_id": 28, "title": "[7월 한정 이벤트] AWS · NAVER Cloud 자격증 취득하고 바람막이 받자!", "release_date": "2026-06-29", "content": "안녕하세요, 인공지능사관학교입니다.\n7월 한 달간 AWS 또는 NAVER Cloud 자격증을 취득한 교육생에게 바람막이를 증정합니다!\n📅 이벤트 기간\n2026.07.01 ~ 2026.07.31\n🎯 참여 대상\nAWS 또는 NAVER Cloud 자격증을 취득한 교육생\n🎁 이벤트 혜택\n바람막이 1벌 증정\n📌 참여 방법\nAWS 또는 NAVER Cloud 자격증 취득\n구글폼을 통해 합격증 제출\n운영진 확인 후 바람막이 증정\n🔗 합격증 제출 구글폼 https://forms.gle/uznorNZnTJpaqvKe7\n※ 이벤트 기간 내 취득한 자격증에 한하여 인정됩니다.\n※ 바람막이 수령 일정은 별도 안내드릴 예정입니다.\n※ 상품 소진 시 이벤트가 조기 종료될 수 있습니다.\n이번 기회를 통해 자격증도 취득하고, 특별한 이벤트 혜택도 함께 받아가세요!", "attachments": [{"file_name": "7월_자격증_취득_이벤트.png.jpg", "file_type": "jpg", "url": "./AICA_notice/notice_attachment/28/7월_자격증_취득_이벤트.png.jpg"}]}, {"notice_id": 27, "title": "6월 성장과정 만족도 조사 안내", "release_date": "2026-06-26", "content": "안녕하세요 여러분! 😊\n어느덧 6월도 마무리되어 가고 있습니다.\n한 달 동안 새로운 내용을 배우고, 과제를 수행하고, 시험과 프로젝트를 준비하며 정말 고생 많으셨습니다. 바쁜 일정 속에서도 꾸준히 성장하기 위해 노력해주신 여러분께 진심으로 감사드립니다.\n6월을 마무리하며 월간 성장과정 만족도 조사가 진행됩니다.\n이번 설문은 강의, 멘토링, 운영 지원, 학습 환경 등 교육 과정 전반에 대한 여러분의 경험을 확인하고 앞으로 더 좋은 교육 환경을 만들어가기 위해 진행됩니다.\n교육을 받으며 도움이 되었던 점, 기억에 남는 좋은 경험, 계속 이어졌으면 하는 부분, 그리고 개선되었으면 하는 점까지 편하게 작성해 주세요. 😊\n여러분의 의견 하나하나가 앞으로의 교육 운영과 학습 지원을 더욱 발전시키는 소중한 밑거름이 됩니다.\n특히 좋았던 부분은 앞으로도 계속 이어갈 수 있도록 아쉬웠던 부분은 더 나은 방향으로 개선할 수 있도록 적극적으로 검토하겠습니다.\n여러분의 소중한 의견이 더 좋은 교육 과정과 학습 환경을 만들어갑니다.\n모든 교육생분들께서는 확인하시는 대로 꼭 참여 부탁드립니다! 🙌\n📆 설문 기간 : ~ 6/30(화) 10:00\n📌 설문 참여 링크\nhttps://forms.gle/ouEQ9WgHSTLKfBgY9\n여러분의 한 달을 돌아보는 시간이라고 생각하시고 편하게 참여해 주세요.\n감사합니다! 😊", "attachments": []}, {"notice_id": 26, "title": "[리마인드] 인공지능사관학교 출결 관리 기준 안내", "release_date": "2026-06-23", "content": "안녕하세요, 인공지능사관학교 교육생 여러분!\n원활하고 성공적인 교육 수료를 위해 꼭 알아두어야 할 출결 관리 기준을 다시 한번 안내해 드립니다.\n출결은 성실한 교육 참여와 완주를 위한 가장 중요한 약속입니다.\n불이익이 발생하지 않도록 아래 내용을 반드시 확인해 주세요!\n1. 기본 출결 및 수료 기준\n수업 시작 시간: 오전 9시 정각\n개인 사정으로 지각하여 교실에 입실할 때는 다른 교육생들의 학업에 방해가 되지 않도록 조용히 입장해 주시기 바랍니다.\n수료 기준: 총 교육 일수의 80% 이상 출석 필수\n2. 지각·조퇴·외출 및 결석 처리 기준 - 9시에 와서 점심먹고 1시에 조퇴하면 결석처리되니 주의해주세요\n지각 · 조퇴 · 외출 :  각 항목 3회 누적 시 결석 1회로 차감 처리됩니다.\n결석 처리 기준: 수업에 참여하지 않거나, 1일 수업 시간의 50% 미만으로 참여할 경우 결석으로 처리됩니다.\n3. 공가(출석 인정) 신청 안내 - 누구든 해당일에 사용 가능합니다.\n질병, 경조사, 취업 면접, 예비군 훈련 등 부득이한 사유로 결석이 필요한 경우 공가를 신청할 수 있습니다.\n신청 방법: 디스코드 채널에 사전 신고\n증빙 필수: 신청 후 반드시 구글폼으로 증빙 서류를 제출해야 최종 출석으로 인정됩니다.\n꼭 기억해 주세요!\n디스코드 사전 신고와 증빙 서류 제출이 모두 완료되어야 공가 처리가 가능합니다.\n미제출 시 결석 처리될 수 있으니 유의 바랍니다.\n어떤 내용이든 궁금한 내용이 있다면 각반 담당 운영진에게 문의주세요!\n모두 마지막까지 지치지 말고 서로 이끌어주며 함께 완주해 봅시다.\n인공지능사관학교도 여러분의 빛나는 성장을 늘 응원합니다! 감사합니다.", "attachments": []}, {"notice_id": 25, "title": "5월 우수교육생 시상 내역 안내", "release_date": "2026-06-22", "content": "안녕하세요.\n인공지능사관학교 운영팀입니다.\n5월 우수교육생으로 선정된 교육생 여러분께 진심으로 축하드리며, 시상 내역을 안내드립니다.\n🎁 시상내역\n* 배달의 민족 상품권 50,000원\n* 인공지능사관학교 텀블러 증정\n※ 이미 지급된 손선풍기는 첫 달 우수교육생 선정 기념으로 제공된 추가 상품이며, 이번 달부터는 5만원권 상품과 인공지능사관학교 텀블러가 지급됩니다.\n우수 교육생은 누구에게나 열려 있는 만큼 6월에도 많은 교육생분들의 적극적인 참여와 성장을 기대하겠습니다. 🚀\n감사합니다.", "attachments": [{"file_name": "5월 우수 교육생.png", "file_type": "png", "url": "./AICA_notice/notice_attachment/25/5월 우수 교육생.png"}]}, {"notice_id": 24, "title": "교육생 건의함 운영 안내", "release_date": "2026-06-22", "content": "여러분 안녕하세요! 😊\n인공지능사관학교 교육 과정과 교육 환경에 대한 다양한 의견을 보다 편하게 전달하실 수 있도록 사업단 사무실에 건의함이 운영되고 있습니다.\n교육을 수강하면서 느낀 불편사항, 개선이 필요한 부분, 건의사항 또는 교육 환경과 관련된 다양한 의견이 있으시다면 자유롭게 작성하여 건의함에 제출해주시기 바랍니다.\n특히 평소 운영진이나 관계자에게 직접 이야기하기 어려웠던 내용이나 공개적으로 전달하기 부담스러웠던 의견도 편하게 작성해주시면 됩니다.\n여러분께서 남겨 주신 의견은 교육 환경 개선과 운영 품질 향상을 위한 참고 자료로 활용될 예정이며 보다 나은 교육 과정 운영을 위해 적극 검토하겠습니다.\n📝 건의함 이용 안내\n위치 : 사업단 사무실(1F 1사무실 옆 벽면)\n대상 : 인공지능사관학교 교육생 누구나\n내용 : 교육, 운영, 시설, 환경 등 건의 및 개선 의견\n작은 의견도 더 나은 교육 환경을 만드는 데 큰 도움이 됩니다.\n많은 관심과 참여 부탁드립니다. 😊\n감사합니다.", "attachments": []}, {"notice_id": 22, "title": "[운영공지] 성장과정 교육생 평가지표 안내", "release_date": "2026-06-15", "content": "안녕하세요.\n인공지능사관학교 운영팀입니다. 😊\n성장과정동안 아래 평가지표를 적용하여 운영할 예정입니다.\n성장과정 교육생평가는 단순한 성과뿐만 아니라 교육기간 동안의 꾸준한 참여와 성장 과정을 종합해서 평가됩니다.\n매월 스스로의 한계를 넘어 발전하는 모습을 보여주시고, 교육과정에 적극적으로 참여해 주시기 바랍니다.\n여러분의 성실한 노력과 도전이 좋은 결과로 이어질 수 있도록 운영팀도 함께 응원하겠습니다.\n평가지표와 관련하여 궁금한 사항이 있으신 경우 언제든 운영진에게 문의해 주세요.\n감사합니다.\n※ 평가지표는 운영 상황에 따라 일부 변경될 수 있습니다.", "attachments": [{"file_name": "성장과정_평가지표.png.png", "file_type": "png", "url": "./AICA_notice/notice_attachment/22/성장과정_평가지표.png.png"}]}, {"notice_id": 21, "title": "인공지능융합사업단(AICA) 온라인 무료 VOD 교육 안내", "release_date": "2026-06-10", "content": "🎯 현재 수강중인 전공 분야의 개념을 복습하고 심화 학습하고 싶다면?\n추가 학습과 자기주도 학습에 활용할 수 있는 온라인 무료 교육 플랫폼을 소개합니다.\n인공지능융합사업단(AICA)에서 운영하는 [AI융합 아카데미]는 AI·데이터 분야의 다양한 온라인 교육 콘텐츠를 무료로 제공하고 있으며\n언제 어디서나 자유롭게 학습할 수 있습니다.\n✅ 주요 내용\n- AI 데이터 분야 온라인 학습 플랫폼 제공\n- 실무 중심 AI 온라인 콘텐츠 운영\n- 입문 · 기초 · 심화 과정 등 총 31개 AI 특화 과정 제공\n- AI 직무 역량 향상을 위한 온라인 무료 교육 지원\n✅ 제공 분야\n- AI 입문\n- 데이터 기술\n- AI 모델링\n- AI 기반 서비스\n- AI 플랫폼&인프라\n- AI 비즈니스\n- AI 세미나\n💻 수강 방법\n1. 교육 채널 접속\n2. 회원 가입 진행\n3. 원하는 강의 신청 후 자유롭게 수강\n💡교육채널 : https://portal.atops.or.kr/lms\n프로젝트 준비, 복습, 관심 분야 심화 학습 등 다양한 목적으로 활용할 수 있으니 필요한 교육생들은 적극 활용해보시기 바랍니다 😊", "attachments": []}, {"notice_id": 20, "title": "[AI카페 제빙기 사용 안내]", "release_date": "2026-06-01", "content": "안녕하세요, 여러분. AI카페 내 비치된 제빙기가 전문 업체 청소를 완료하여 6/2부터 정상 사용 가능함을 안내 드립니다.\n쾌적한 이용을 위해 아래 사항을 꼭 준수해주시기 바랍니다.\n사용 후 얼음 스쿱은 반드시 제빙기 상단 제자리에 올려두기\n사용 후 제빙기 문을 꼭 닫기\n모두가 위생적으로 사용할 수 있도록 깨끗하게 이용하기\n서로 배려하는 사용 문화 조성에 협조 부탁드립니다.\n감사합니다.", "attachments": []}, {"notice_id": 19, "title": "인공지능사관학교 정규 교육 시작 시간 안내", "release_date": "2026-06-01", "content": "안녕하세요! 인공지능사관학교입니다:)\n인공지능사관학교 정규 교육 시간을 다시 한 번 안내 드립니다.\n간혹 지각 체크 시점인 오전 9시 10분을 실제 수업 시작 시간으로 혼동하는 경우가 있어 안내드리는 것이며\n오전 9시 10분은 지각 여부를 확인하는 기준 시점일 뿐, 교육은 오전 9시부터 정상적으로 진행됩니다.\n원활한 수업 참여를 위해 오전 9시 이전까지 착석 및 준비를 완료해주시길 부탁드리며\n모두가 함께 좋은 학습 분위기를 만들어갈 수 있도록 협조 부탁드리겠습니다.\n감사합니다 🙂", "attachments": []}, {"notice_id": 17, "title": "6월 Talk Up 행사 안내", "release_date": "2026-06-01", "content": "안녕하세요!\n인공지능사관학교입니다👋\n여러분들과 사관학교의 유대감 형성을 위한 소통의 장!\n매월 한 번, 인공지능사관학교 전체 교육생과 운영진이 함께하는 Talk Up 행사에 여러분을 초대합니다!\nTalk Up에서는\n✔ 따뜻한 칭찬이 오가는 [인사교 킹오브킹]\n✔ 서로의 경험을 나누는 [인사교 쇼케이스]\n✔ 함께 성장하는 이야기를 듣는 [공감 우체통]\n✔ 사관학교와 소통하는 [인사교 더 나은 내일/무엇이든 물어보살]\n🗓 일시: 2026년 6월 16일(화) 16:00~16:30\n📍 참여 링크: 추후 공지 예정\n🎤 대상: 인공지능사관학교 전 교육생\n🎁 칭찬합시다와 인사교 쇼케이스를 진행한 교육생에게는 소정의 선물 제공\n[참여 설문 안내]\n📪 인사교 킹오브킹\n평소 칭찬하고 싶은 교육생, 운영진, 강사님, 멘토님(보조강사)가 있다면 아래 링크를 통해서 추천해주세요!\n칭찬설문 링크: https://forms.gle/Gc7yF7ccvJWTuMqXA\n📮 공감 우체통\n평소 사관학교에 대해 궁금했던 점 혹은 소통하고 싶은 내용들을 작성해주세요!\n소통함 링크: https://forms.gle/xEiQuVc4Nx3qsct5A\n📮 무엇이든 물어보살\n무엇이든 물어보살 : https://forms.gle/VYpfmgw6vqa98hcg9\n성장하는 여러분의 목소리를 들려주고\n함께 나누고, 함께 웃는 \"Talk Up\", 절대 놓치지 마세요!\n감사합니다.", "attachments": [{"file_name": "TALK_UP _참여_가이드.pdf.pdf", "file_type": "pdf", "url": "./AICA_notice/notice_attachment/17/TALK_UP _참여_가이드.pdf.pdf"}]}, {"notice_id": 18, "title": "6월 일정표 안내", "release_date": "2026-05-29", "content": "6월 주요 일정표 안내 드리니 참고 부탁드리며\n6월달에는 인공지능사관학교 7기 교육생과 함께하는 talk up이 예정되어 있으니\n여러분들의 많은 참여 바랍니다", "attachments": [{"file_name": "6월_교육_일정표.png.png", "file_type": "png", "url": "./AICA_notice/notice_attachment/18/6월_교육_일정표.png.png"}]}, {"notice_id": 16, "title": "월간 만족도 조사 안내", "release_date": "2026-05-28", "content": "더 나은 교육 환경과 학습 경험을 만들어가기 위해 월간 만족도 조사를 진행합니다.\n강의, 멘토링, 운영 지원, 학습 환경 등 교육 과정 전반에 대해 여러분이 직접 경험하신 내용을 바탕으로 편하게 작성해주시면 됩니다.\n여러분의 의견은 이후 교육 운영과 학습 지원 방향을 점검하고, 좋은 부분은 더욱 강화하고 보완이 필요한 부분은 개선해나가기 위한 자료로 활용될 예정입니다.\n교육 과정에 참여하시며 느끼신 만족스러운 경험, 도움이 되었던 부분, 개선되면 좋겠다고 생각한 점까지 부담 없이 자유롭게 남겨주세요 🙂\n설문 참여를 통해 남겨주시는 의견 하나하나가 더 좋은 교육 과정과 학습 환경을 만들어가는 데 큰 도움이 됩니다.\n여러분의 적극적인 참여와 소중한 의견은 더 좋은 교육 과정과 학습 환경을 만들어가는 데 큰 힘이 됩니다.\n모든 분들께서는 확인하시는 대로 꼭 참여 부탁드립니다!🙌\n📆 설문 기간 : ~ 6월 1일 월요일 오전 10시까지\n<설문 참여 링크> https://forms.gle/59frSxdHabwqa2Wo8", "attachments": []}, {"notice_id": 15, "title": "AWS · 네이버클라우드 자격증 학습 및 바우처 지원 안내", "release_date": "2026-05-26", "content": "☁️ AI 시대, 클라우드는 이제 기본 역량!\n안녕하세요.\n인공지능사관학교 운영팀입니다.\nAI·데이터 분야 실무 환경에서 클라우드 활용 역량의 중요성이 점점 커지고 있습니다.\n교육생 여러분의 클라우드 역량 강화를 위해\nAWS Foundational 및 네이버클라우드 NCA 자격증 응시를 지원합니다.\n기초 자격증 취득 시 다음 단계 자격증까지 응시할 수 있도록 단계별 바우처도 지원 예정입니다.\n자세한 자격증 소개 및 학습 방법은 아래 첨부파일 참고 부탁드립니다.\n궁금하신 점은 각반 담당 운영진에게 문의하시기 바랍니다.\n지금 바로 학습하고 자격증 취득에 도전해보시기 바랍니다! 😊", "attachments": [{"file_name": "자격증_취득_안내.pdf.pdf", "file_type": "pdf", "url": "./AICA_notice/notice_attachment/15/자격증_취득_안내.pdf.pdf"}]}, {"notice_id": 14, "title": "교육장 학습 환경 조성 안내", "release_date": "2026-05-25", "content": "안녕하세요!\n인공지능사관학교입니다🫡\n원활한 교육 운영과 쾌적한 학습 환경 조성을 위해 타 반 출입은 가급적 자제해 주시기 바라며\n휴게실과 AI CAFE와 같은 공용공간을 활용하여 소통해 주시기 바랍니다.\n다른 교육생들의 수업 집중도와 학습 분위기에 영향을 줄 수 있으므로, 서로 배려하는 마음으로 협조 부탁드립니다❣️\n또한 개인 소지품 분실 및 관리 소홀로 인한 불편이 발생할 수 있는 만큼 귀중품과 개인 물품은 각자 철저히 관리해 주시기 바라며\n자리 이동이나 외출 시에도 소지품 확인을 생활화하여 분실 및 도난 사고를 예방할 수 있도록 각별히 유의해 주시면 감사하겠습니다.\n모든 교육생이 안전하고 질서 있는 환경에서 교육에 집중할 수 있도록 성숙한 공동체 의식과 상호 배려를 바탕으로 적극적인 협조 부탁드립니다.\n감사합니다🙇‍♀️", "attachments": []}, {"notice_id": 13, "title": "야간/주말 자율학습 운영 안내", "release_date": "2026-05-18", "content": "교육생 안녕하세요! 인공지능사관학교입니다:) 교육생 여러분의 자기주도 학습 역량 강화를 위해 자율 학습 시간을 운영합니다. 자율학습 시간에는 개인 프로젝트 수행, 학습 내용 복습, 코딩 테스트 준비 등 학습 목적에 맞게 자유롭게 활용해주시기 바랍니다! ⚠️ 자율학습은 교육생 여러분의 자율적인 참여와 협조를 바탕으로 운영되고 있습니다. 모두가 쾌적하게 이용할 수 있도록 여러분들의 협조 부탁 드리겠습니다. [자율학습 신청]\n평일 : 야간 자율 학습 / 야자-신고🌙 채널 통해 신청\n주말 : 야간 자율 학습 / 주말-신고🚴 채널 통해 신청\n신청 마감 시간 : 오후 5시\n[이용 및 퇴실]\n이용 가능 시간 : 평일(21시 55분까지) / 주말(9시-18시까지)\n퇴실 시 : 본인 작성 글에 ✅ 표시로 퇴실 확인\n마지막 퇴실자 : 소등 후 인증 사진 촬영 및 야간 자율 학습 / 소등-인증📷 채널 업로드 필수\n[이용 규칙 및 주의사항] - 이용 시 기본적인 정리 및 시설 이용 규칙을 준수해 주시기 바랍니다.\n평일은 22시에 소등하기 때문에 21시 55분까지 정리 후 퇴실해 주시기 바랍니다.\n개인 물품은 서로 건드리지 않도록 주의해 주시기 바랍니다.\n타인에게 불편을 주는 행동(소음, 자리 점유 등)은 자제해 주시기 바랍니다.\n사용 후 자리 정리 및 주변 정돈을 반드시 해주시기 바랍니다.\n자율 학습 이용 시 각 반에서 지정된 본인 자리에서 이용해 주시기 바랍니다.\n마지막 퇴실자의 소등 및 정리 정돈, 이용 수칙 등이 지속적으로 지켜지지 않을 경우 자율 학습 운영 시간 및 방식이 조정될 수 있습니다.\n감사합니다.", "attachments": []}, {"notice_id": 12, "title": "TIL(Today I Learned) 작성 안내", "release_date": "2026-05-18", "content": "안녕하세요 여러분!\nTIL(Today I Learned)은 하루 동안 학습한 내용을 스스로 정리하고 돌아보는 학습 기록 공간입니다.\n인공지능사관학교는 PBL(Project-Based Learning) 기반 학습 방식으로 진행되는 만큼,\n단순히 강의를 듣는 것에서 끝나는 것이 아니라 직접 학습 내용을 정리하고 회고하는 과정도 중요하게 생각하고 있습니다.\nTIL에는 아래와 같은 내용을 자유롭게 작성해주시면 됩니다.\n오늘 학습한 주요 내용 및 핵심 개념\n실습 내용 및 결과물\n새롭게 알게 된 점\n어려웠던 부분과 해결 과정\n개선할 점 및 다음 학습 계획\n함께 공유하고 싶은 자료 및 팁\n특히 단순한 내용 나열보다는\n“내가 어떻게 이해했고, 어떤 부분을 고민했는지”를 본인의 언어로 기록해보시는 것을 추천드립니다.\n또한 TIL 작성 여부 및 작성 내용은 월별 학습 평가 항목에 포함될 예정이므로 꾸준하고 성실하게 작성 부탁드립니다.\n✅ TIL 작성 시 기대할 수 있는 강점\n복습 자료 정리 : 학습 내용과 실습 결과를 체계적으로 누적 가능\n프로젝트 및 포트폴리오 활용 : 프로젝트 진행 과정과 문제 해결 경험 정리 가능\n면접 활용도 향상 : 학습 과정, 기술적 고민, 성장 경험을 기반으로 답변 정리 가능\n꾸준한 기록은 이후 복습, 프로젝트 진행, 포트폴리오 정리에도 큰 도움이 될 수 있습니다.\n자세한 작성 방법 및 예시는 아래 노션 가이드를 참고해주시기 바랍니다!\n📌 TIL 작성 가이드 : 노션 가이드\nhttps://www.notion.so/TIL-361c9a6158b780369eaec1c4a132a1ef\n📌 TIL 작성 템플릿 : 노션 템플릿\nhttps://www.notion.so/_OO-_-361c9a6158b7801b9a6fff4208ca754a\n※ 템플릿 복제 후 생성된 본인 TIL 페이지 링크는 각 반 담당 운영진이 확인할 수 있도록 공유 설정 후 전달 부탁드립니다.\n감사합니다!", "attachments": []}, {"notice_id": 11, "title": "자율 스터디 운영 현황 조사 안내", "release_date": "2026-05-18", "content": "안녕하세요!\n인공지능사관학교입니다:)\n현재 교육생분들 사이에서 다양한 분야의 스터디가 자율적으로 활발하게 운영되고 있어, 스터디 현황 파악 및 향후 운영 지원을 위한 설문 조사를 진행하고자 합니다.\n스터디를 운영 중이거나 참여하고 있는 교육생분들께서는 아래 설문에 참여 부탁드립니다❣️\n🔗 자율 스터디 현황 조사 설문 링크 : https://forms.gle/dDW6sZVgfmanY3YP9\n참고로 설문 응답자는 추후 진행 예정인 현직 멘토님과 함께하는 「스터디랩」 모집 및 선발 과정에서 가산점이 부여될 예정이니 여러분들의 많은 참여 부탁드립니다❣️\n감사합니다.", "attachments": []}, {"notice_id": 23, "title": "스터디랩 지원 안내", "release_date": "2026-05-15", "content": "안녕하세요!\n인공지능사관학교입니다:)\n정규 수업 외에 교육생분들이 자율적으로 스터디를 진행할 수 있는 스터디랩을 진행하고자 합니다!\n인공지능 <script>
(function(){
  const ALL_NOTICES = JSON.parse(document.getElementById('notices-data').textContent);

  // "오늘" 기준: 데이터 내 최신 작성일 (데모/스냅샷 데이터 기준으로 NEW 배지 계산)
  const LATEST_DATE = ALL_NOTICES.reduce((max, n) => n.release_date > max ? n.release_date : max, ALL_NOTICES[0].release_date);
  const NEW_WINDOW_DAYS = 3;

  function isNew(dateStr){
    const d1 = new Date(dateStr);
    const d0 = new Date(LATEST_DATE);
    const diffDays = Math.round((d0 - d1) / (1000*60*60*24));
    return diffDays >= 0 && diffDays <= NEW_WINDOW_DAYS;
  }

  function formatDate(dateStr){
    const [y,m,d] = dateStr.split('-');
    return `${y}.${m}.${d}`;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // 화면 표시 전용: "파일명.pdf.pdf" 같은 중복 확장자를 "파일명.pdf"로만 보여줌.
  // 실제 링크(att.url)는 원본 파일명을 그대로 사용하므로 파일 열람에는 영향 없음.
  function displayFileName(name){
    const m = name.match(/^(.*)\.([A-Za-z0-9]+)\.([A-Za-z0-9]+)$/);
    if (m && m[2].toLowerCase() === m[3].toLowerCase()){
      return `${m[1]}.${m[3]}`;
    }
    return name;
  }

  const listEl = document.getElementById('listEl');
  const countLabel = document.getElementById('countLabel');
  const searchInput = document.getElementById('searchInput');
  const loadTail = document.getElementById('loadTail');
  const sentinel = document.getElementById('sentinel');

  const PAGE_SIZE = 12;
  let filtered = ALL_NOTICES.slice();
  let renderedCount = 0;

  function applySearch(query){
    const q = query.trim().toLowerCase();
    filtered = q
      ? ALL_NOTICES.filter(n => n.title.toLowerCase().includes(q))
      : ALL_NOTICES.slice();
    renderedCount = 0;
    listEl.innerHTML = '';
    countLabel.textContent = `총 ${filtered.length}건`;
    if (filtered.length === 0){
      listEl.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>'${escapeHtml(query)}'에 대한 공지를 찾지 못했어요.<br>다른 검색어로 시도해 보세요.</div>`;
      loadTail.textContent = '';
      return;
    }
    renderNextPage();
  }

  function attachmentChip(att){
    return `
      <a class="attachment-link" href="${att.url}" target="_blank" rel="noopener">
        <span class="ext">${att.file_type}</span>
        ${escapeHtml(displayFileName(att.file_name))}
      </a>`;
  }

  function renderRow(n, no){
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.id = n.notice_id;

    const newBadge = isNew(n.release_date) ? '<span class="new-badge">NEW</span>' : '';
    const clipBadge = n.attachments.length ? '<span class="clip-badge">📎</span>' : '';

    row.innerHTML = `
      <div class="row-head">
        <div class="no-badge">${no}</div>
        <div class="row-main">
          <div class="row-title-line">
            <span class="row-title">${escapeHtml(n.title)}</span>
            ${newBadge}${clipBadge}
          </div>
          <div class="row-date">${formatDate(n.release_date)}</div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="row-body">
        <div class="row-body-inner">
          <p class="notice-content">${escapeHtml(n.content || '내용이 없습니다.')}</p>
          ${n.attachments.length ? `<div class="attachments">${n.attachments.map(attachmentChip).join('')}</div>` : ''}
        </div>
      </div>
    `;

    row.querySelector('.row-head').addEventListener('click', () => {
      row.classList.toggle('open');
    });

    return row;
  }

  function renderNextPage(){
    const next = filtered.slice(renderedCount, renderedCount + PAGE_SIZE);
    next.forEach((n, i) => listEl.appendChild(renderRow(n, n.notice_id)));
    renderedCount += next.length;

    if (renderedCount >= filtered.length){
      loadTail.textContent = filtered.length ? '— 모든 공지를 불러왔습니다 —' : '';
    } else {
      loadTail.textContent = '스크롤하면 더 불러옵니다 ⌄';
    }
  }

  // Infinite scroll
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && renderedCount < filtered.length){
        renderNextPage();
      }
    });
  }, { rootMargin: '200px' });
  observer.observe(sentinel);

  // Search (light debounce)
  let debounceTimer = null;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const val = e.target.value;
    debounceTimer = setTimeout(() => applySearch(val), 150);
  });

  // Initial render
  countLabel.textContent = `총 ${ALL_NOTICES.length}건`;
  renderNextPage();
})();
</script>
</body>
</html>
