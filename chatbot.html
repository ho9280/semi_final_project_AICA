<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 아카데미 챗봇</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f8f9fa; display: flex; flex-direction: column; height: 100vh; }

        /* 상단 헤더 */
        .chat-header {
            background: #007bff; color: white;
            padding: 12px 16px; display: flex; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .home-btn {
            background: white; color: #007bff; border: none;
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
            font-weight: bold; margin-right: 12px;
        }
        .chat-header h2 { margin: 0; font-size: 1.1rem; }

        /* 메시지 영역 */
        .chat-body {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }

        /* 말풍선 공통 */
        .bubble-wrap { display: flex; align-items: flex-end; gap: 8px; }
        .bubble-wrap.user { flex-direction: row-reverse; }

        .bubble {
            max-width: 75%; padding: 10px 14px; border-radius: 12px;
            font-size: 14px; line-height: 1.5; white-space: pre-wrap;
        }
        .bubble.bot { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px 12px 12px 0; }
        .bubble.user { background: #007bff; color: white; border-radius: 12px 12px 0 12px; }
        .bubble.loading { background: #ffffff; border: 1px solid #e0e0e0; color: #888; font-style: italic; }

        /* 카테고리 버튼 */
        .category-wrap { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
        .category-btn {
            padding: 8px 16px; border: none; border-radius: 20px;
            background: #007bff; color: white; cursor: pointer;
            font-size: 14px; font-weight: bold;
        }
        .category-btn:hover { background: #0056b3; }

        /* 계산기 열기 버튼 */
        .calc-btn {
            margin-top: 8px; padding: 10px 16px; border: none;
            border-radius: 8px; background: #ff8c00; color: white;
            cursor: pointer; font-size: 14px; font-weight: bold; display: block;
        }
        .calc-btn:hover { background: #e07b00; }

        /* 응답 후 버튼 */
        .action-wrap { display: flex; gap: 8px; padding: 4px 0; }
        .action-btn {
            padding: 8px 16px; border: 1px solid #007bff;
            border-radius: 20px; background: white; color: #007bff;
            cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .action-btn:hover { background: #e8f0fe; }

        /* 입력창 */
        .chat-input-wrap {
            display: flex; gap: 8px; padding: 12px 16px;
            background: white; border-top: 1px solid #e0e0e0;
        }
        .chat-input-wrap textarea {
            flex: 1; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; resize: none; font-size: 14px;
            font-family: sans-serif; height: 40px; line-height: 1.4;
        }
        .send-btn {
            padding: 10px 18px; background: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 14px;
        }
        .send-btn:disabled { background: #aaa; cursor: not-allowed; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 상단 헤더 -->
<div class="chat-header">
    <button class="home-btn" onclick="location.href='main.html'">🏠 HOME</button>
    <h2>🤖 인공지능사관학교 7기 챗봇</h2>
</div>

<!-- 메시지 영역 -->
<div class="chat-body" id="chatBody"></div>

<!-- 입력창 -->
<div class="chat-input-wrap">
    <textarea id="chatInput" placeholder="질문을 입력하세요. (Enter: 전송 / Shift+Enter: 줄바꿈)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
</div>

<!-- attendance_agent_ui.js 포함 -->
<script src="attendance_agent_ui.js"></script>

<script>
    const CHAT_API = "http://localhost:8001/chat";
    const FIXED_THREAD_ID = "aica_demo_session";

    // 계산기 API 주소 오버라이드
    attendanceUI.apiUrl = "http://localhost:8001/attendance/calculate";

    // 상태 관리
    let currentState = "IDLE"; // IDLE / SENDING / RESPONDED

    // =====================
    // 초기화
    // =====================
    function init() {
        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML = '';
        currentState = "IDLE";

        // 인사 버블
        appendBotBubble("안녕하세요! 인공지능사관학교 7기 챗봇입니다.\n원하시는 메뉴를 선택하거나 직접 질문을 입력해 주세요.");

        // 카테고리 버튼
        appendCategoryButtons();

        // 입력창 활성화
        setInputEnabled(true);
    }

    // =====================
    // 카테고리 버튼 렌더
    // =====================
    function appendCategoryButtons() {
        const wrap = document.createElement('div');
        wrap.className = 'category-wrap';
        wrap.id = 'categoryButtons';

        const categories = [
            { label: '출결', value: '출결' },
            { label: '공지사항', value: '공지' },
            { label: '메뉴', value: '식단' },
            { label: '그 외 문의', value: '그 외 문의' },
        ];

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.innerText = cat.label;
            btn.onclick = () => sendMessage(cat.value);
            wrap.appendChild(btn);
        });

        document.getElementById('chatBody').appendChild(wrap);
        scrollToBottom();
    }

    // =====================
    // 메시지 전송
    // =====================
    async function sendMessage(forcedInput = null) {
        const input = document.getElementById('chatInput');
        const userText = forcedInput || input.value.trim();

        if (!userText || currentState === "SENDING") return;

        // 카테고리 버튼 제거
        const categoryButtons = document.getElementById('categoryButtons');
        if (categoryButtons) categoryButtons.remove();

        // 응답 후 버튼 제거
        const actionWrap = document.getElementById('actionButtons');
        if (actionWrap) actionWrap.remove();

        // 유저 버블 추가
        appendUserBubble(userText);
        input.value = '';

        // 로딩 상태
        currentState = "SENDING";
        setInputEnabled(false);
        const loadingBubble = appendLoadingBubble();

        try {
            const res = await fetch(CHAT_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_input: userText,
                    thread_id: FIXED_THREAD_ID
                })
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            // 로딩 버블 제거
            loadingBubble.remove();

            // 봇 응답 버블
            appendBotBubble(data.text);

            // action 처리
            if (data.action === "OPEN_CALCULATOR_POPUP") {
                appendCalcButton();
            }

            // 응답 후 버튼
            if (data.show_buttons !== false) {
                appendActionButtons();
            }

            currentState = "RESPONDED";
            setInputEnabled(true);

        } catch (error) {
            loadingBubble.remove();
            appendBotBubble("서버 통신 오류가 발생했습니다. 서버 실행 여부를 확인해 주세요.");
            appendActionButtons();
            currentState = "RESPONDED";
            setInputEnabled(true);
        }
    }

    // =====================
    // 버블 생성 함수
    // =====================
    function appendBotBubble(text) {
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap bot';

        const bubble = document.createElement('div');
        bubble.className = 'bubble bot';
        bubble.innerText = text;

        wrap.appendChild(bubble);
        document.getElementById('chatBody').appendChild(wrap);
        scrollToBottom();
        return wrap;
    }

    function appendUserBubble(text) {
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap user';

        const bubble = document.createElement('div');
        bubble.className = 'bubble user';
        bubble.innerText = text;

        wrap.appendChild(bubble);
        document.getElementById('chatBody').appendChild(wrap);
        scrollToBottom();
    }

    function appendLoadingBubble() {
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap bot';

        const bubble = document.createElement('div');
        bubble.className = 'bubble loading';
        bubble.innerText = '● ● ● 생각 중...';

        wrap.appendChild(bubble);
        document.getElementById('chatBody').appendChild(wrap);
        scrollToBottom();
        return wrap;
    }

    // =====================
    // 계산기 버튼 렌더
    // =====================
    function appendCalcButton() {
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap bot';

        const inner = document.createElement('div');
        inner.className = 'bubble bot';

        const btn = document.createElement('button');
        btn.className = 'calc-btn';
        btn.innerText = '🧮 7기 출결 계산기 열기';
        btn.onclick = () => attendanceUI.mount();

        inner.appendChild(btn);
        wrap.appendChild(inner);
        document.getElementById('chatBody').appendChild(wrap);
        scrollToBottom();
    }

    // =====================
    // 응답 후 버튼 렌더
    // =====================
    function appendActionButtons() {
        const wrap = document.createElement('div');
        wrap.className = 'action-wrap';
        wrap.id = 'actionButtons';

        const resetBtn = document.createElement('button');
        resetBtn.className = 'action-btn';
        resetBtn.innerText = '처음으로';
        resetBtn.onclick = () => init();

        const continueBtn = document.createElement('button');
        continueBtn.className = 'action-btn';
        continueBtn.innerText = '더 질문하기';
        continueBtn.onclick = () => {
            wrap.remove();
            document.getElementById('chatInput').focus();
            currentState = "IDLE";
        };

        wrap.appendChild(resetBtn);
        wrap.appendChild(continueBtn);
        document.getElementById('chatBody').appendChild(wrap);
        scrollToBottom();
    }

    // =====================
    // 입력창 활성화/비활성화
    // =====================
    function setInputEnabled(enabled) {
        const input = document.getElementById('chatInput');
        const btn = document.getElementById('sendBtn');
        input.disabled = !enabled;
        btn.disabled = !enabled;
    }

    // =====================
    // 자동 스크롤
    // =====================
    function scrollToBottom() {
        const chatBody = document.getElementById('chatBody');
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // =====================
    // 엔터 전송 / Shift+Enter 줄바꿈
    // =====================
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // =====================
    // 페이지 진입 시 초기화
    // =====================
    window.onload = () => init();
</script>
</body>
</html>
