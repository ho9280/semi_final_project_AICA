<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 아카데미 민원 게시판</title>
    <style>
        /* UI 디자이너 이식 전 임시 레이아웃 및 상태 스타일 */
        body { font-family: sans-serif; margin: 20px; }
        .container { display: flex; gap: 20px; }
        .section { flex: 1; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        .feed-card { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .form-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        
        /* 공감 버튼 시각적 분기 (핵심) */
        .btn-like { cursor: pointer; padding: 5px 10px; border: 1px solid #ddd; background: #fff; }
        .btn-like.liked { color: red; border-color: red; cursor: not-allowed; opacity: 0.7; }
        .btn-like.unliked { color: gray; }
        
        .hidden { display: none; }
        textarea { resize: vertical; min-height: 80px; }
    </style>
</head>
<body>

    <header style="margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #000;">
        <h2>🏛️ 광주 AI 아카데미 민원 서비스 (임시 UI)</h2>
        <label>👤 현재 사용자 및 권한 스위처: </label>
        <select id="userRole" onchange="switchRole()">
            <option value="1">학생 1 (user_id: 1)</option>
            <option value="admin">관리자 (user_id: 99)</option>
        </select>
    </header>

    <div class="container">
        <!-- 좌측: 민원 폼 (작성 및 상세조회 공유) -->
        <div class="section" id="formSection">
            <h3 id="formTitle">📝 새 민원 작성</h3>
            <input type="hidden" id="currentComplaintId">
            
            <div class="form-group">
                <label>카테고리</label>
                <select id="category">
                    <option value="청결">청결</option>
                    <option value="시설">시설</option>
                    <option value="학사/수업">학사/수업</option>
                    <option value="환경">환경</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>원문 작성란 (상세조회 시에만 노출/작성 가능)</label>
                <textarea id="rawContent" placeholder="민원 내용을 상세히 적어주세요."></textarea>
            </div>

            <button id="btnSummarize" onclick="previewSummary()">✨ AI 요약하기</button>

            <div class="form-group" style="margin-top: 10px;">
                <label>💡 AI 요약 결과</label>
                <textarea id="summary" placeholder="요약 결과가 여기에 표시됩니다."></textarea>
            </div>

            <div class="form-group">
                <label>📎 첨부파일 링크 (선택)</label>
                <input type="url" id="photoUrl" placeholder="https://drive.google.com/...">
            </div>

            <hr>
            <!-- 하단 액션 버튼 그룹 (권한 및 모드에 따라 동적 스위칭) -->
            <div id="studentActionGroup">
                <button onclick="submitComplaint()" style="width:100%; padding: 10px;">🚀 최종 제출하기</button>
            </div>
            <div id="adminActionGroup" class="hidden">
                <p>⚙️ 관리자 상태 변경:</p>
                <button onclick="updateStatus('접수')">접수</button>
                <button onclick="updateStatus('처리 중')">처리 중</button>
                <button onclick="updateStatus('처리 완료')">처리 완료</button>
                <button onclick="updateStatus('승인 거절')">승인 거절</button>
            </div>
            <button onclick="resetForm()" style="margin-top: 10px; width: 100%;">초기화 (새 글 작성)</button>
        </div>

        <!-- 우측: 피드 게시판 -->
        <div class="section">
            <h3>📢 공개 민원 피드</h3>
            <div id="filterGroup" style="margin-bottom: 15px;">
                <button onclick="loadComplaints('')">전체</button>
                <button onclick="loadComplaints('청결')">청결</button>
                <button onclick="loadComplaints('시설')">시설</button>
                <button onclick="loadComplaints('학사/수업')">학사/수업</button>
                <button onclick="loadComplaints('환경')">환경</button>
                <button onclick="loadComplaints('기타')">기타</button>
            </div>
            <div id="feedContainer">
                <!-- JS 동적 렌더링 영역 -->
            </div>
        </div>
    </div>

<script>
    const API_BASE = "http://127.0.0.1:8000/api";
    let currentUserData = { id: 1, role: 'student' };
    
    // 1. 역할 스위칭 로직
    function switchRole() {
        const val = document.getElementById('userRole').value;
        if (val === 'admin') {
            currentUserData = { id: 99, role: 'admin' };
            document.getElementById('summary').readOnly = true;
        } else {
            currentUserData = { id: parseInt(val), role: 'student' };
            document.getElementById('summary').readOnly = false;
        }
        resetForm();
        loadComplaints('');
    }

    // 2. 피드 목록 불러오기 (GET)
    async function loadComplaints(categoryFilter = '') {
        try {
            let url = `${API_BASE}/complaints?current_user_id=${currentUserData.id}`;
            if (categoryFilter) url += `&category=${encodeURIComponent(categoryFilter)}`;
            
            const res = await fetch(url);
            const data = await res.json();
            renderFeed(data);
        } catch (error) {
            console.error("목록 조회 실패:", error);
        }
    }

    // 3. 카드 동적 렌더링 (익명성 보장 뷰)
    function renderFeed(complaints) {
        const container = document.getElementById('feedContainer');
        container.innerHTML = '';

        complaints.forEach(item => {
            // 좋아요 UI 분기 (임시 UI 클래스 적용)
            const likeClass = item.is_liked_by_me ? 'liked' : 'unliked';
            const likeText = item.is_liked_by_me ? '❤️ 공감완료' : '🤍 공감하기';
            const disabledAttr = item.is_liked_by_me ? 'disabled' : '';

            const card = document.createElement('div');
            card.className = 'feed-card';
            card.innerHTML = `
                <div><strong>[${item.category}]</strong> <span style="float:right; color:blue;">[${item.status}]</span></div>
                <p style="margin: 10px 0;">💡 ${item.summary}</p>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <button class="btn-like ${likeClass}" ${disabledAttr} onclick="toggleLike(${item.id})">
                        ${likeText} (${item.like_count})
                    </button>
                    <button onclick="openDetail(${item.id})">🔍 상세 / 전체보기</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 4. 상세/전체보기 모달(폼에 데이터 주입)
    async function openDetail(id) {
        try {
            // 본래라면 GET /api/complaints/{id} 단건 조회가 이상적이나, 현재 목록 데이터 활용
            const res = await fetch(`${API_BASE}/complaints?current_user_id=${currentUserData.id}`);
            const data = await res.json();
            const target = data.find(c => c.id === id);
            
            if(!target) return;

            document.getElementById('formTitle').innerText = "🔍 민원 상세 조회";
            document.getElementById('currentComplaintId').value = target.id;
            document.getElementById('category').value = target.category;
            document.getElementById('rawContent').value = target.raw_content; // 숨겨진 원본 노출
            document.getElementById('summary').value = target.summary;
            document.getElementById('photoUrl').value = target.photo_url || '';

            // 버튼부 UI 스위칭
            if (currentUserData.role === 'admin') {
                document.getElementById('studentActionGroup').classList.add('hidden');
                document.getElementById('adminActionGroup').classList.remove('hidden');
            } else {
                document.getElementById('studentActionGroup').classList.add('hidden');
                document.getElementById('adminActionGroup').classList.add('hidden');
                // 일반 학생은 상세보기 폼에서 제출/변경 불가 처리
            }
        } catch (error) {
            console.error("상세 조회 실패:", error);
        }
    }

    // 5. 공감(좋아요) 토글 (POST)
    async function toggleLike(complaintId) {
        try {
            const res = await fetch(`${API_BASE}/complaints/${complaintId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserData.id })
            });
            const result = await res.json();
            
            if (res.ok) {
                // 성공 시 리스트 재조회로 UI 업데이트 (실제로는 DOM만 부분 조작하는 것이 효율적)
                loadComplaints('');
            } else {
                alert(result.detail || "오류가 발생했습니다.");
            }
        } catch (error) {
            console.error("공감 처리 실패:", error);
        }
    }

    // 6. AI 요약 API (POST)
    async function previewSummary() {
        const category = document.getElementById('category').value;
        const rawContent = document.getElementById('rawContent').value;
        if (!rawContent) return alert("원문을 입력하세요.");

        try {
            const res = await fetch(`${API_BASE}/complaints/summarize`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category, raw_content: rawContent })
            });
            const data = await res.json();
            document.getElementById('summary').value = data.summary;
        } catch (error) {
            console.error("요약 실패:", error);
        }
    }

    // 7. 신규 민원 제출 (POST)
    async function submitComplaint() {
        const payload = {
            user_id: currentUserData.id,
            category: document.getElementById('category').value,
            raw_content: document.getElementById('rawContent').value,
            summary: document.getElementById('summary').value,
            photo_url: document.getElementById('photoUrl').value || null
        };

        if (!payload.raw_content || !payload.summary) return alert("원문과 요약을 모두 확인하세요.");

        try {
            const res = await fetch(`${API_BASE}/complaints`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert("민원이 제출되었습니다!");
                resetForm();
                loadComplaints('');
            }
        } catch (error) {
            console.error("제출 실패:", error);
        }
    }

    // 8. 관리자 상태 변경 (PATCH)
    async function updateStatus(newStatus) {
        const id = document.getElementById('currentComplaintId').value;
        if (!id) return alert("상태를 변경할 민원을 선택하세요.");

        try {
            const res = await fetch(`${API_BASE}/complaints/${id}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if (res.ok) {
                alert(`상태가 [${newStatus}]로 변경되었습니다.`);
                loadComplaints('');
            }
        } catch (error) {
            console.error("상태 변경 실패:", error);
        }
    }

    function resetForm() {
        document.getElementById('currentComplaintId').value = '';
        document.getElementById('rawContent').value = '';
        document.getElementById('summary').value = '';
        document.getElementById('photoUrl').value = '';
        document.getElementById('formTitle').innerText = "📝 새 민원 작성";
        
        if (currentUserData.role === 'student') {
            document.getElementById('studentActionGroup').classList.remove('hidden');
            document.getElementById('adminActionGroup').classList.add('hidden');
        } else {
            document.getElementById('studentActionGroup').classList.add('hidden');
            document.getElementById('adminActionGroup').classList.add('hidden');
        }
    }

    // 초기 데이터 로드
    window.onload = () => loadComplaints('');
</script>
</body>
</html>
